name: 微信粘贴兼容问题
description: 报告可以稳定复现的编辑、复制或微信显示问题
title: "[兼容问题] "
labels: ["bug", "wechat-compat"]
body:
  - type: markdown
    attributes:
      value: 请只填写脱敏内容，不要提交完整文章、后台登录截图、密码、验证码或恢复码。
  - type: input
    id: version
    attributes:
      label: 拾光版本
      placeholder: 例如 V4.1.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 系统与浏览器
      placeholder: 例如 macOS 15 / Chrome 140
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: 主题或组件
      placeholder: 例如 墨绿·条 / 编号清单
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开工具开始，写清每一步操作。
    validations:
      required: true
  - type: dropdown
    id: reopen
    attributes:
      label: 微信保存草稿并重新打开后的结果
      options:
        - 尚未测试
        - 仍可复现
        - 重开后恢复正常
    validations:
      required: true
  - type: textarea
    id: sanitized
    attributes:
      label: 最小脱敏示例或截图
      description: 请删除真实姓名、账号、客户信息和未发布正文。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认提交内容已脱敏，且不含密码、验证码、Cookie、二维码或恢复码。
          required: true

